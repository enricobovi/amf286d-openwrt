name: MF286D OpenWrt 25.12.4 FULL

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:

  # ============================================================
  # 1. DOWNLOAD OPENWRT IMAGEBUILDER
  # ============================================================
  - name: Download OpenWrt ImageBuilder
    shell: bash
    run: |
      set -e

      wget -q \
        https://downloads.openwrt.org/releases/25.12.4/targets/ipq40xx/generic/openwrt-imagebuilder-25.12.4-ipq40xx-generic.Linux-x86_64.tar.zst

      tar --zstd -xf \
        openwrt-imagebuilder-25.12.4-ipq40xx-generic.Linux-x86_64.tar.zst

      IB_DIR="$(find . -maxdepth 1 -type d -name 'openwrt-imagebuilder-*' | head -n1)"

      if [ -z "$IB_DIR" ]; then
        echo "ImageBuilder directory not found"
        exit 1
      fi

      echo "IB_DIR=$IB_DIR" >> "$GITHUB_ENV"


  # ============================================================
  # 2. ADD 4ICEG APK REPOSITORY + TRUST KEY
  # ============================================================
  - name: Configure 4IceG APK repository
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      mkdir -p keys

      wget -q \
        https://github.com/4IceG/Modem-extras-apk/raw/refs/heads/main/myapk/IceG-apkpub.pem \
        -O keys/IceG-apkpub.pem

      echo "https://github.com/4IceG/Modem-extras-apk/raw/refs/heads/main/myapk/packages.adb" \
        >> repositories

      echo
      echo "=== APK repositories ==="
      cat repositories

      echo
      echo "=== APK keys ==="
      ls -l keys/


  # ============================================================
  # 3. ADD APN-WEB
  # ============================================================
  - name: Add apn-web
    shell: bash
    run: |
      set -e

      mkdir -p apn-package
      mkdir -p files

      wget -q \
        https://github.com/ilblogdicristiangallo/apn-web-html_ipk/raw/refs/heads/main/apn-web-1.0.3-r1.apk \
        -O apn-package/apn-web.apk

      echo "Downloaded apn-web:"
      ls -lh apn-package/apn-web.apk

      mkdir -p apn-extract

      tar -xOf apn-package/apn-web.apk data.tar.gz \
        | tar -xz -C apn-extract

      cp -a apn-extract/. files/

      echo
      echo "=== apn-web files ==="
      find apn-extract -maxdepth 4 -type f | sort


  # ============================================================
  # 4. PREPARE CUSTOM CONFIGURATION
  # ============================================================
  - name: Prepare custom configuration
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      mkdir -p files/etc/uci-defaults
      mkdir -p files/etc/init.d
      mkdir -p files/etc/config
      mkdir -p files/usr/bin
      mkdir -p files/mnt/usb


      # ========================================================
      # WIFI + GUEST + FIREWALL
      # ========================================================
      cat > files/etc/uci-defaults/99-mf286d-custom <<'EOF'
      #!/bin/sh

      # --------------------------------------------------------
      # WIFI COUNTRY
      # --------------------------------------------------------
      uci set wireless.radio0.country='IT' 2>/dev/null || true
      uci set wireless.radio1.country='IT' 2>/dev/null || true

      # Disable existing Wi-Fi interfaces.
      for section in $(uci show wireless 2>/dev/null | \
          sed -n "s/^wireless\.[^=]*=wifi-iface$/\1/p"); do
          uci set wireless.$section.disabled='1'
      done


      # --------------------------------------------------------
      # MAIN 2.4 GHz
      # --------------------------------------------------------
      uci set wireless.main2g='wifi-iface'
      uci set wireless.main2g.device='radio0'
      uci set wireless.main2g.mode='ap'
      uci set wireless.main2g.network='lan'
      uci set wireless.main2g.ssid='MF286D-MAIN'
      uci set wireless.main2g.encryption='sae-mixed'
      uci set wireless.main2g.key='Mf286D-ChangeMe!2026'
      uci set wireless.main2g.disabled='0'


      # --------------------------------------------------------
      # MAIN 5 GHz
      # --------------------------------------------------------
      uci set wireless.main5g='wifi-iface'
      uci set wireless.main5g.device='radio1'
      uci set wireless.main5g.mode='ap'
      uci set wireless.main5g.network='lan'
      uci set wireless.main5g.ssid='MF286D-MAIN'
      uci set wireless.main5g.encryption='sae-mixed'
      uci set wireless.main5g.key='Mf286D-ChangeMe!2026'
      uci set wireless.main5g.disabled='0'


      # --------------------------------------------------------
      # GUEST NETWORK
      # --------------------------------------------------------
      uci set network.guest='interface'
      uci set network.guest.proto='static'
      uci set network.guest.ipaddr='192.168.50.1'
      uci set network.guest.netmask='255.255.255.0'


      # --------------------------------------------------------
      # GUEST DHCP
      # --------------------------------------------------------
      uci set dhcp.guest='dhcp'
      uci set dhcp.guest.interface='guest'
      uci set dhcp.guest.start='100'
      uci set dhcp.guest.limit='100'
      uci set dhcp.guest.leasetime='12h'


      # --------------------------------------------------------
      # GUEST 2.4 GHz
      # --------------------------------------------------------
      uci set wireless.guest2g='wifi-iface'
      uci set wireless.guest2g.device='radio0'
      uci set wireless.guest2g.mode='ap'
      uci set wireless.guest2g.network='guest'
      uci set wireless.guest2g.ssid='MF286D-GUEST'
      uci set wireless.guest2g.encryption='sae-mixed'
      uci set wireless.guest2g.key='Mf286D-Guest!2026'
      uci set wireless.guest2g.disabled='0'


      # --------------------------------------------------------
      # GUEST 5 GHz
      # --------------------------------------------------------
      uci set wireless.guest5g='wifi-iface'
      uci set wireless.guest5g.device='radio1'
      uci set wireless.guest5g.mode='ap'
      uci set wireless.guest5g.network='guest'
      uci set wireless.guest5g.ssid='MF286D-GUEST'
      uci set wireless.guest5g.encryption='sae-mixed'
      uci set wireless.guest5g.key='Mf286D-Guest!2026'
      uci set wireless.guest5g.disabled='0'


      uci commit wireless
      uci commit network
      uci commit dhcp


      # --------------------------------------------------------
      # GUEST FIREWALL ZONE
      # --------------------------------------------------------
      uci add firewall zone
      uci set firewall.@zone[-1].name='guest'
      uci set firewall.@zone[-1].network='guest'
      uci set firewall.@zone[-1].input='REJECT'
      uci set firewall.@zone[-1].output='ACCEPT'
      uci set firewall.@zone[-1].forward='REJECT'


      # Guest -> Internet
      uci add firewall forwarding
      uci set firewall.@forwarding[-1].src='guest'
      uci set firewall.@forwarding[-1].dest='wan'


      # DHCP
      uci add firewall rule
      uci set firewall.@rule[-1].name='Guest-DHCP'
      uci set firewall.@rule[-1].src='guest'
      uci set firewall.@rule[-1].proto='udp'
      uci set firewall.@rule[-1].dest_port='67-68'
      uci set firewall.@rule[-1].target='ACCEPT'


      # DNS
      uci add firewall rule
      uci set firewall.@rule[-1].name='Guest-DNS'
      uci set firewall.@rule[-1].src='guest'
      uci set firewall.@rule[-1].proto='tcp udp'
      uci set firewall.@rule[-1].dest_port='53'
      uci set firewall.@rule[-1].target='ACCEPT'


      # Explicitly block Guest -> LAN
      uci add firewall rule
      uci set firewall.@rule[-1].name='Guest-Block-LAN'
      uci set firewall.@rule[-1].src='guest'
      uci set firewall.@rule[-1].dest_ip='192.168.1.0/24'
      uci set firewall.@rule[-1].target='REJECT'


      uci commit firewall

      exit 0
      EOF

      chmod +x files/etc/uci-defaults/99-mf286d-custom


      # ========================================================
      # SAMBA
      # ========================================================
      cat > files/etc/config/samba4 <<'EOF'
      config samba
          option name 'MF286D'
          option workgroup 'WORKGROUP'
          option description 'MF286D Home Storage'
          option homes '0'
          option interface 'lan'

      config sambashare
          option name 'Home'
          option path '/mnt/usb'
          option read_only 'no'
          option guest_ok 'yes'
          option create_mask '0666'
          option dir_mask '0777'
      EOF


      # ========================================================
      # USB STORAGE MOUNT
      # ========================================================
      cat > files/etc/init.d/usb-storage-mount <<'EOF'
      #!/bin/sh /etc/rc.common

      START=95

      start() {
          mkdir -p /mnt/usb

          sleep 5

          for DEV in /dev/sd[a-z][0-9]; do
              if [ -b "$DEV" ]; then
                  if ! mountpoint -q /mnt/usb; then
                      mount "$DEV" /mnt/usb 2>/dev/null

                      if mountpoint -q /mnt/usb; then
                          logger -t usb-storage \
                              "Mounted $DEV on /mnt/usb"
                          break
                      fi
                  fi
              fi
          done
      }

      stop() {
          if mountpoint -q /mnt/usb; then
              umount /mnt/usb 2>/dev/null || true
          fi
      }
      EOF

      chmod +x files/etc/init.d/usb-storage-mount


      # ========================================================
      # LTE WATCHDOG INIT
      # ========================================================
      cat > files/etc/init.d/lte-watchdog <<'EOF'
      #!/bin/sh /etc/rc.common

      START=99

      start() {
          /usr/bin/lte-watchdog &
      }

      stop() {
          killall lte-watchdog 2>/dev/null || true
      }
      EOF

      chmod +x files/etc/init.d/lte-watchdog


      # ========================================================
      # LTE WATCHDOG
      #
      # 2 failures = WAN reconnect
      # 4 failures = ModemManager restart
      # 6 failures = modem reset
      # 8 failures = router reboot
      #
      # Check every 60 seconds.
      # ========================================================
      cat > files/usr/bin/lte-watchdog <<'EOF'
      #!/bin/sh

      STATE="/tmp/lte-watchdog.fail"
      FAIL=0

      [ -f "$STATE" ] && FAIL=$(cat "$STATE" 2>/dev/null)

      while true; do

          IP_OK=0
          DNS_OK=0


          # ----------------------------------------------------
          # Internet connectivity
          # ----------------------------------------------------
          if ping -c 2 -W 5 1.1.1.1 >/dev/null 2>&1; then
              IP_OK=1
          fi


          # ----------------------------------------------------
          # DNS connectivity
          # ----------------------------------------------------
          if nslookup openwrt.org 1.1.1.1 >/dev/null 2>&1; then
              DNS_OK=1
          fi


          if [ "$IP_OK" = "1" ] && [ "$DNS_OK" = "1" ]; then

              if [ "$FAIL" -gt 0 ]; then
                  logger -t lte-watchdog \
                      "Internet/LTE connection restored"
              fi

              FAIL=0
              echo 0 > "$STATE"

          else

              FAIL=$((FAIL + 1))
              echo "$FAIL" > "$STATE"

              logger -t lte-watchdog \
                  "Internet/LTE failure $FAIL"


              # ------------------------------------------------
              # RECOVERY 1: WAN reconnect
              # ------------------------------------------------
              if [ "$FAIL" -eq 2 ]; then

                  logger -t lte-watchdog \
                      "Recovery 1: WAN reconnect"

                  ifdown wan 2>/dev/null || true
                  sleep 10
                  ifup wan 2>/dev/null || true
              fi


              # ------------------------------------------------
              # RECOVERY 2: ModemManager restart
              # ------------------------------------------------
              if [ "$FAIL" -eq 4 ]; then

                  logger -t lte-watchdog \
                      "Recovery 2: ModemManager restart"

                  /etc/init.d/modemmanager restart \
                      2>/dev/null || true

                  sleep 45
              fi


              # ------------------------------------------------
              # RECOVERY 3: MODEM RESET
              # ------------------------------------------------
              if [ "$FAIL" -eq 6 ]; then

                  logger -t lte-watchdog \
                      "Recovery 3: modem reset"

                  if command -v mmcli >/dev/null 2>&1; then

                      MODEM_ID=$(
                          mmcli -L 2>/dev/null |
                          sed -n 's#.*Modem/[0-9]*.*#\1#p' |
                          head -n1
                      )

                      if [ -n "$MODEM_ID" ]; then

                          logger -t lte-watchdog \
                              "Resetting modem $MODEM_ID"

                          mmcli -m "$MODEM_ID" --reset \
                              >/dev/null 2>&1 || true

                          sleep 60

                      else

                          logger -t lte-watchdog \
                              "No ModemManager modem found"
                      fi
                  fi
              fi


              # ------------------------------------------------
              # RECOVERY 4: ROUTER REBOOT
              # ------------------------------------------------
              if [ "$FAIL" -ge 8 ]; then

                  logger -t lte-watchdog \
                      "LTE recovery failed - rebooting router"

                  reboot
              fi

          fi

          sleep 60
      done
      EOF

      chmod +x files/usr/bin/lte-watchdog


      # ========================================================
      # ENABLE SERVICES
      # ========================================================
      cat > files/etc/uci-defaults/100-mf286d-services <<'EOF'
      # Enable custom services.

      /etc/init.d/usb-storage-mount enable 2>/dev/null || true
      /etc/init.d/lte-watchdog enable 2>/dev/null || true

      exit 0
      EOF

      chmod +x files/etc/uci-defaults/100-mf286d-services


  # ============================================================
  # 5. BUILD PACKAGE LIST
  # ============================================================
  - name: Build package list
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      cat > /tmp/packages.txt <<'EOF'
      luci
      luci-ssl

      luci-proto-qmi
      luci-proto-mbim
      luci-proto-modemmanager

      modemmanager
      uqmi
      umbim
      libqmi

      usb-modeswitch

      kmod-usb-net-qmi-wwan
      kmod-usb-net-cdc-mbim
      kmod-usb-wdm

      kmod-usb-serial
      kmod-usb-serial-option
      kmod-usb-serial-wwan

      wireguard-tools
      kmod-wireguard
      luci-proto-wireguard

      openvpn-openssl
      luci-app-openvpn

      kmod-usb-storage
      block-mount
      kmod-fs-ext4
      kmod-fs-vfat

      samba4-server
      luci-app-samba4

      curl
      wget-ssl
      ca-bundle
      jq
      tcpdump

      # 4IceG
      luci-app-3ginfo-lite
      luci-app-sms-tool-js
      luci-app-sms-manager
      EOF

      PACKAGES="$(tr '\n' ' ' < /tmp/packages.txt)"

      echo "PACKAGES=$PACKAGES" >> "$GITHUB_ENV"

      echo
      echo "=== Requested packages ==="
      cat /tmp/packages.txt


  # ============================================================
  # 6. VERIFY 4ICEG REPOSITORY
  # ============================================================
  - name: Verify 4IceG repository
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      wget -q \
        https://github.com/4IceG/Modem-extras-apk/raw/refs/heads/main/myapk/packages.adb \
        -O /tmp/4iceg-packages.adb

      test -s /tmp/4iceg-packages.adb

      echo "4IceG packages.adb downloaded successfully."
      ls -lh /tmp/4iceg-packages.adb

      echo
      echo "Using the original signed 4IceG repository."
      echo "No locally generated unsigned packages.adb is created."


  # ============================================================
  # 7. CHECK PACKAGE RESOLUTION
  # ============================================================
  - name: Check ImageBuilder package resolution
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      echo
      echo "=== IMAGEBUILDER INFORMATION ==="
      make info

      echo
      echo "=== PACKAGE RESOLUTION TEST ==="

      make manifest \
        PROFILE="zte_mf286d" \
        PACKAGES="$PACKAGES" \
        STRIP_ABI=1 \
        V=s


  # ============================================================
  # 8. BUILD FINAL SYSUPGRADE IMAGE
  # ============================================================
  - name: Build MF286D firmware
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      make image \
        PROFILE="zte_mf286d" \
        PACKAGES="$PACKAGES" \
        FILES="files" \
        EXTRA_IMAGE_NAME="FULL-25.12.4" \
        V=s


  # ============================================================
  # 9. VERIFY FIRMWARE
  # ============================================================
  - name: Verify firmware
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      echo
      echo "=== GENERATED IMAGES ==="

      find bin/targets/ipq40xx/generic \
        -maxdepth 1 \
        -type f \
        -print \
        -exec ls -lh {} \;


      IMAGE="$(
        find bin/targets/ipq40xx/generic \
          -type f \
          -name '*zte_mf286d*squashfs-sysupgrade.bin' \
          | head -n1
      )"


      if [ -z "$IMAGE" ]; then
        echo "ERROR: MF286D sysupgrade image was not generated."
        exit 1
      fi


      echo
      echo "=== SUCCESS ==="
      echo "$IMAGE"


      echo
      echo "=== SHA256 ==="
      sha256sum "$IMAGE"


      echo
      echo "=== SIZE ==="
      du -h "$IMAGE"


  # ============================================================
  # 10. SHOW FINAL MANIFEST
  # ============================================================
  - name: Show final manifest
    shell: bash
    run: |
      set -e

      cd "$IB_DIR"

      make manifest \
        PROFILE="zte_mf286d" \
        PACKAGES="$PACKAGES" \
        STRIP_ABI=1 \
        > /tmp/final-manifest.txt

      echo "=== FINAL MANIFEST ==="
      cat /tmp/final-manifest.txt


  # ============================================================
  # 11. UPLOAD FIRMWARE
  # ============================================================
  - name: Upload firmware artifact
    uses: actions/upload-artifact@v4
    with:
      name: MF286D-OpenWrt-25.12.4-FULL
      path: |
        ${{ env.IB_DIR }}/bin/targets/ipq40xx/generic/*zte_mf286d*squashfs-sysupgrade.bin
      if-no-files-found: error
      retention-days: 30
